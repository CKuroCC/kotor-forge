<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOTOR Forge</title>
<meta name="description" content="KOTOR II: The Sith Lords modding, driven from Claude. Toolchain, format map and MCP tool surface.">
<style>
:root{
  --bg:#080a0e; --panel:#111620; --panel2:#19202c; --line:#28323f;
  --ink:#dde5ef; --dim:#8d9aab; --faint:#5e6b7a;
  --amber:#d4922c; --amber2:#f0b95c; --cyan:#4aa8bd; --sith:#a33a3a;
  --jedi:#4e8f70; --violet:#7263a8;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
a{color:var(--cyan)}
.mono{font-family:var(--mono)}
.muted{color:var(--dim)}
.faint{color:var(--faint)}

header{padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#141b26,#0a0d12);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;color:var(--amber2);letter-spacing:.08em}
header .sub{font-family:var(--mono);font-size:12px;color:var(--dim)}

nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);
  background:#0c1016;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font:inherit;font-size:13px;padding:9px 12px;cursor:pointer;
  white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--amber2);border-bottom-color:var(--amber)}

main{padding:20px 22px 70px;max-width:1500px}
.grid{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--amber2)}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
.kv dt{color:var(--dim);font-size:12.5px}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink)}

.stat{font-family:var(--mono);font-size:26px;color:var(--amber2);line-height:1.1}
.stat small{display:block;font-family:system-ui,sans-serif;font-size:12px;
  color:var(--dim);margin-top:5px;letter-spacing:.02em}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;
  padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid #1d242e;vertical-align:top}
tbody tr:hover{background:#151c26}
td.mono,th.mono{font-family:var(--mono)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:7px;
  background:var(--panel)}

.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:11.5px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-family:var(--mono);white-space:nowrap}
.pill.lifecycle{background:#2a2216;color:#e3bd7c;border-color:#4a3a1f}
.pill.query{background:#182a30;color:#8fc9d6;border-color:#2a4a53}
.pill.edit{background:#2a1d2f;color:#c7a2d6;border-color:#46324f}
.pill.mods{background:#1c2c22;color:#9fd3ac;border-color:#2f4f38}
.pill.saves{background:#2c2418;color:#e0c48a;border-color:#4d3f23}
.pill.on{background:#1c2c22;color:#9fd3ac;border-color:#2f4f38}
.pill.off{background:#2f1d1d;color:#d39f9f;border-color:#512f2f}
.pill.rw{background:#1c2c22;color:#9fd3ac;border-color:#2f4f38}
.pill.ro{background:#182a30;color:#8fc9d6;border-color:#2a4a53}
.pill.no{background:#1c2028;color:#6d7886;border-color:#2a333f}

.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;
  background:#1f2733;color:var(--dim);font-family:var(--mono);margin:1px 3px 1px 0}

.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input[type=search],select{background:#0b0f15;color:var(--ink);
  border:1px solid var(--line);border-radius:5px;padding:5px 9px;font:inherit;
  font-size:13px}
input[type=search]{min-width:200px;flex:1;max-width:340px}
.count{font-family:var(--mono);font-size:12px;color:var(--faint)}

pre{background:#0b0f15;border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
  margin:0;color:var(--ink);line-height:1.5}
code{background:#0b0f15;border-radius:3px;padding:1px 5px;font-family:var(--mono);
  font-size:12.5px;color:var(--amber2)}
pre code{background:none;padding:0;color:inherit}

.bar{height:5px;background:#1f2733;border-radius:4px;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;
  background:linear-gradient(90deg,var(--amber),var(--amber2))}

.empty{color:var(--faint);font-style:italic;padding:14px}
.note{border-left:3px solid var(--amber);padding:2px 14px;color:var(--dim);
  margin:10px 0}
.warn{border-left:3px solid var(--sith);padding:2px 14px;color:#e0b0b0;margin:10px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lede{font-size:15px;color:var(--dim);max-width:78ch;margin:0 0 16px}
h2.sec{font-size:16px;color:var(--amber2);margin:22px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
h2.sec:first-child{margin-top:0}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:9px 12px;margin-bottom:7px}
summary{cursor:pointer;color:var(--ink);font-family:var(--mono);font-size:13px}
summary::marker{color:var(--faint)}
details[open] summary{color:var(--amber2);margin-bottom:8px}
.stale{background:#3a2320;color:#ffb4a2;border:1px solid #5a3630;
  border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>KOTOR FORGE</h1>
  <span class="sub" id="hdr-meta">loading&hellip;</span>
</header>
<nav id="tabs"></nav>
<main>
  <section id="t-overview"></section>
  <section id="t-toolchain" hidden></section>
  <section id="t-tools" hidden></section>
  <section id="t-formats" hidden></section>
  <section id="t-install" hidden></section>
  <section id="t-library" hidden></section>
  <section id="t-build" hidden></section>
  <section id="t-decisions" hidden></section>
</main>
<script src="js/app.js"></script>
</body>
</html>
